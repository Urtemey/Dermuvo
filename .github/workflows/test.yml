name: build-and-differential-tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - run: dotnet restore tests/Durevo.Tests --locked-mode
      - run: dotnet run --project tests/Durevo.Tests -c Release --no-restore
      - run: dotnet restore src/Durevo.Cli --locked-mode
      - run: dotnet build src/Durevo.Cli -c Release --no-restore
      - name: Build native Windows backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-native-windows.ps1
          Copy-Item artifacts/native-win-x64/durevo_vm.dll tests/Durevo.Tests/bin/Release/net10.0/
      - name: Build native Linux backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libssl-dev
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -shared native/durevo_encrypted.c -lcrypto -o tests/Durevo.Tests/bin/Release/net10.0/libdurevo_vm.so
      - name: Native and CLI regression
        run: dotnet run --project tests/Durevo.Tests -c Release --no-build -- --native --release-cli src/Durevo.Cli/bin/Release/net10.0/Durevo.Cli.dll
      - name: Verified native name-resolution negative control
        shell: pwsh
        run: |
          $nativeName = if ($IsWindows) { 'durevo_vm.dll' } else { 'libdurevo_vm.so' }
          dotnet run --project tests/Durevo.Tests -c Release --no-build -- --verified-native-probe "tests/Durevo.Tests/bin/Release/net10.0/$nativeName" --poison-name
      - name: Native sanitizers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer native/fuzz_smoke.c -o /tmp/durevo-fuzz
          /tmp/durevo-fuzz
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer native/encrypted_fuzz_smoke.c -lcrypto -o /tmp/durevo-encrypted-fuzz
          /tmp/durevo-encrypted-fuzz
          sh scripts/test-native-interposition.sh
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer native/string_fuzz_smoke.c -o /tmp/durevo-string-fuzz
          /tmp/durevo-string-fuzz
